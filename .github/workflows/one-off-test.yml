name: One-off 15:30 test

# Explicitly requested on 2026-10-19; no recurring trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TEST_AT: '2026-10-19T15:30:00+02:00'
  TEST_MESSAGE: '15:30 test'
  FEED_URL: https://maxsiska.github.io/element-feed/feed.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test generation and timing safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Wait until 15:30 Berlin and prepare the test message
        run: python3 scheduled_test.py generate --at "$TEST_AT" --message "$TEST_MESSAGE"
      - name: Include the separate diagnostic feed
        run: python3 diagnostics.py bundle
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public/
      - name: Reject a late deployment
        run: python3 scheduled_test.py guard --at "$TEST_AT"
      - id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 2
      - name: Verify the public test feed
        run: python3 publication.py verify --feed-url "$FEED_URL"
