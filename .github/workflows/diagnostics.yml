name: Publish isolated diagnostic feed

on:
  workflow_dispatch:
    inputs:
      publish_at:
        description: 'Optional one-off time with UTC offset; arm at most 20 minutes ahead'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# All Pages publishers share this lock because a deployment replaces the site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUBLISH_AT: ${{ inputs.publish_at }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test feed isolation
        run: python3 -m unittest discover -s tests -v
      - name: Wait for the scheduled diagnostic publication
        if: ${{ inputs.publish_at != '' }}
        run: |
          python3 - <<'PY'
          import os
          from scheduled_test import parse_time, wait_until
          wait_until(parse_time(os.environ['PUBLISH_AT']))
          PY
      - name: Prepare diagnostics and preserve the current lunch feeds
        run: python3 diagnostics.py prepare
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public/
      - name: Confirm the lunch feeds have not changed
        run: python3 diagnostics.py guard
      - name: Reject a late scheduled test
        if: ${{ inputs.publish_at != '' }}
        run: python3 scheduled_test.py guard --at "$PUBLISH_AT"
      - id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 2
      - name: Verify diagnostics and unchanged lunch feeds
        run: python3 diagnostics.py verify
