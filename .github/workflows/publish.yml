name: Publish feed

on:
  schedule:
    # Three chances to publish before noon if GitHub delays or drops a run.
    # Every attempt reuses the same daily entry ID for bot deduplication.
    - cron: '20,35,50 11 * * 1-5'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and generate a preview without publishing or notifying rooms'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FEED_URL: https://maxsiska.github.io/element-feed/lunch/feed.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test the feed generator and publication safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Check the publication window and live feed
        id: plan
        if: ${{ !inputs.dry_run }}
        run: python3 publication.py plan --feed-url "$FEED_URL"
      - name: Generate feed
        if: ${{ inputs.dry_run || steps.plan.outputs.publish == 'true' }}
        env:
          FEED_LINK: ${{ github.server_url }}/${{ github.repository }}
        run: python3 generate_feed.py --link "$FEED_LINK" public/lunch
      - name: Preserve the retired feeds without new entries
        if: ${{ inputs.dry_run || steps.plan.outputs.publish == 'true' }}
        run: cp -R static/. public/
      - name: Save a preview for dry runs
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: feed-preview
          path: public/
          retention-days: 3
      - uses: actions/upload-pages-artifact@v4
        if: ${{ steps.plan.outputs.publish == 'true' }}
        with:
          path: public/
      - name: Reject publication if the run became too late
        if: ${{ steps.plan.outputs.publish == 'true' }}
        run: python3 publication.py guard --expected public/lunch/feed.json
      - id: deployment
        if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: actions/deploy-pages@v4
        timeout-minutes: 2
        continue-on-error: true
      - name: Wait briefly and recheck the deadline before retrying deployment
        if: ${{ steps.plan.outputs.publish == 'true' && steps.deployment.outcome == 'failure' }}
        run: |
          sleep 15
          python3 publication.py guard --expected public/lunch/feed.json
      - id: deployment_retry
        name: Retry the same Pages artifact once
        if: ${{ steps.plan.outputs.publish == 'true' && steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
        timeout-minutes: 2
      - name: Verify the public feed
        if: ${{ steps.plan.outputs.publish == 'true' }}
        run: python3 publication.py verify --feed-url "$FEED_URL" --expected public/lunch/feed.json
