name: Publish feed

on:
  schedule:
    # 12:00 Berlin time on weekdays, with retries in case GitHub drops a run.
    - cron: '0,7,17 12 * * 1-5'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Send a labeled test message, even when recurring invitations are disabled'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate feed
        env:
          TEST_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_message }}
        shell: bash
        run: |
          args=(--link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" public)
          if [[ "$TEST_MESSAGE" == "true" ]]; then
            args+=(--test-id "$GITHUB_RUN_ID")
          fi
          python3 generate_feed.py "${args[@]}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public/
      - id: deployment
        uses: actions/deploy-pages@v4
