name: Publish feed

on:
  schedule:
    # One scheduled publication per weekday, at 11:50 Berlin time.
    - cron: '50 11 * * 1-5'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate feed
        env:
          FEED_LINK: ${{ github.server_url }}/${{ github.repository }}
        run: python3 generate_feed.py --link "$FEED_LINK" public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public/
      - id: deployment
        uses: actions/deploy-pages@v4
